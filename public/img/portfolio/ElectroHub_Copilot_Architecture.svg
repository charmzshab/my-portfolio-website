<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">ElectroHub Copilot Agent Architecture</title>
  <desc id="desc">Layered architecture showing customer channels, Copilot Studio orchestration, authored topics, generative answers, Power Automate product filtering, data sources, presentation, shared state, and governance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FAFC"/>
      <stop offset="1" stop-color="#EDF4FA"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F6CBD"/>
      <stop offset="1" stop-color="#243A8F"/>
    </linearGradient>
    <linearGradient id="det" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9F4FF"/>
      <stop offset="1" stop-color="#D9EAFB"/>
    </linearGradient>
    <linearGradient id="gen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1EAFE"/>
      <stop offset="1" stop-color="#E5D9FA"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#17324D" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#59758D"/>
    </marker>
    <style>
      .title{font:700 38px 'Segoe UI',Arial,sans-serif;fill:#12344D}
      .subtitle{font:400 18px 'Segoe UI',Arial,sans-serif;fill:#526879}
      .layer{font:700 15px 'Segoe UI',Arial,sans-serif;fill:#557083;letter-spacing:1.5px}
      .boxTitle{font:700 21px 'Segoe UI',Arial,sans-serif;fill:#12344D}
      .boxTitleWhite{font:700 25px 'Segoe UI',Arial,sans-serif;fill:white}
      .body{font:400 15px 'Segoe UI',Arial,sans-serif;fill:#385166}
      .bodyWhite{font:400 16px 'Segoe UI',Arial,sans-serif;fill:#EAF4FC}
      .small{font:600 14px 'Segoe UI',Arial,sans-serif;fill:#385166}
      .pill{font:600 13px 'Segoe UI',Arial,sans-serif;fill:#26455C}
      .footer{font:600 13px 'Segoe UI',Arial,sans-serif;fill:#607789}
      .line{fill:none;stroke:#59758D;stroke-width:3;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#7A8FA1;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1600" height="1120" fill="url(#bg)"/>
  <circle cx="1450" cy="80" r="160" fill="#D7EAF8" opacity="0.48"/>
  <circle cx="100" cy="1030" r="210" fill="#E8DDF8" opacity="0.32"/>

  <text x="80" y="70" class="title">ElectroHub Copilot Agent Architecture</text>
  <text x="80" y="104" class="subtitle">Hybrid conversational architecture: deterministic transactions + grounded generative answers</text>

  <!-- Experience layer -->
  <text x="80" y="156" class="layer">EXPERIENCE LAYER</text>
  <rect x="84" y="181" width="1440" height="100" rx="22" fill="#17324D" opacity="0.10"/>
  <rect x="80" y="175" width="1440" height="100" rx="22" fill="#FFFFFF"/>
  <g transform="translate(115,197)">
    <circle cx="32" cy="28" r="27" fill="#DCEFFC"/>
    <circle cx="32" cy="20" r="9" fill="#0F6CBD"/>
    <path d="M16 48c2-12 10-18 16-18s14 6 16 18" fill="#0F6CBD"/>
    <text x="75" y="24" class="boxTitle">Customer</text>
    <text x="75" y="48" class="body">Web chat / Teams / published channel</text>
  </g>
  <path d="M500 225 H675" class="line"/>
  <g transform="translate(705,193)">
    <rect x="0" y="0" width="385" height="63" rx="16" fill="#E8F3FC" stroke="#9CC9E8"/>
    <text x="28" y="27" class="boxTitle">Conversational UI</text>
    <text x="28" y="50" class="body">Messages • buttons • Adaptive Cards • citations</text>
  </g>
  <path d="M1120 225 H1325" class="line"/>
  <g transform="translate(1355,198)">
    <rect x="0" y="0" width="118" height="54" rx="27" fill="#107C10"/>
    <text x="59" y="34" text-anchor="middle" style="font:700 16px 'Segoe UI',Arial;fill:white">Response</text>
  </g>

  <!-- Core -->
  <text x="80" y="328" class="layer">COPILOT STUDIO CORE</text>
  <rect x="85" y="354" width="1440" height="150" rx="26" fill="#17324D" opacity="0.14"/>
  <rect x="80" y="347" width="1440" height="150" rx="26" fill="url(#hero)"/>
  <g transform="translate(120,376)">
    <rect width="94" height="94" rx="22" fill="#FFFFFF" opacity="0.17"/>
    <path d="M28 30h38v28H45l-12 11V58h-5z" fill="white" opacity="0.95"/>
    <circle cx="42" cy="44" r="3" fill="#0F6CBD"/><circle cx="51" cy="44" r="3" fill="#0F6CBD"/><circle cx="60" cy="44" r="3" fill="#0F6CBD"/>
  </g>
  <text x="245" y="397" class="boxTitleWhite">ElectroHubTechGuide</text>
  <text x="245" y="426" class="bodyWhite">Generative orchestration analyzes intent and selects a topic, tool, or knowledge response.</text>
  <g transform="translate(245,449)">
    <rect width="178" height="31" rx="15" fill="#FFFFFF" opacity="0.17"/><text x="89" y="21" text-anchor="middle" class="pill" fill="white">Intent routing</text>
    <rect x="190" width="178" height="31" rx="15" fill="#FFFFFF" opacity="0.17"/><text x="279" y="21" text-anchor="middle" class="pill" fill="white">Topic descriptions</text>
    <rect x="380" width="178" height="31" rx="15" fill="#FFFFFF" opacity="0.17"/><text x="469" y="21" text-anchor="middle" class="pill" fill="white">Tool selection</text>
    <rect x="570" width="205" height="31" rx="15" fill="#FFFFFF" opacity="0.17"/><text x="672" y="21" text-anchor="middle" class="pill" fill="white">Grounded generation</text>
  </g>
  <g transform="translate(1165,375)">
    <rect width="300" height="95" rx="18" fill="#FFFFFF" opacity="0.14"/>
    <text x="25" y="32" class="bodyWhite">Shared conversation context</text>
    <text x="25" y="58" class="bodyWhite">CustomerName • Category</text>
    <text x="25" y="81" class="bodyWhite">BudgetMin/Max • OrderNumber</text>
  </g>

  <path d="M800 497 V535 H415 V568" class="line"/>
  <path d="M800 497 V535 H1185 V568" class="line"/>

  <!-- Branches -->
  <text x="80" y="550" class="layer">PROCESSING PATHS</text>
  <rect x="85" y="577" width="930" height="345" rx="25" fill="#17324D" opacity="0.09"/>
  <rect x="80" y="570" width="930" height="345" rx="25" fill="url(#det)" stroke="#A5CAE7" stroke-width="2"/>
  <rect x="1045" y="577" width="480" height="345" rx="25" fill="#17324D" opacity="0.09"/>
  <rect x="1040" y="570" width="480" height="345" rx="25" fill="url(#gen)" stroke="#C3A8EA" stroke-width="2"/>

  <text x="120" y="615" class="boxTitle">Deterministic transaction path</text>
  <text x="1080" y="615" class="boxTitle">Generative knowledge path</text>

  <!-- Topics -->
  <g transform="translate(120,642)">
    <rect width="250" height="86" rx="17" fill="#FFFFFF" stroke="#8EBCE0"/>
    <text x="22" y="31" class="boxTitle">Authored topics</text>
    <text x="22" y="56" class="body">Name • Product Inquiry</text>
    <text x="22" y="76" class="body">Order Status • End/CSAT</text>
  </g>
  <path d="M370 685 H430" class="line"/>
  <g transform="translate(455,642)">
    <rect width="250" height="86" rx="17" fill="#FFFFFF" stroke="#8EBCE0"/>
    <text x="22" y="31" class="boxTitle">Structured inputs</text>
    <text x="22" y="56" class="body">Category • Budget range</text>
    <text x="22" y="76" class="body">EH-##### order number</text>
  </g>
  <path d="M705 685 H765" class="line"/>
  <g transform="translate(790,642)">
    <rect width="180" height="86" rx="17" fill="#FFFFFF" stroke="#8EBCE0"/>
    <text x="20" y="31" class="boxTitle">Power Fx</text>
    <text x="20" y="56" class="body">Validation</text>
    <text x="20" y="76" class="body">Branching &amp; mapping</text>
  </g>

  <!-- Flow/data -->
  <path d="M880 728 V758 H255 V787" class="line"/>
  <g transform="translate(120,787)">
    <rect width="270" height="92" rx="17" fill="#FFFFFF" stroke="#8EBCE0"/>
    <text x="22" y="31" class="boxTitle">Power Automate flow</text>
    <text x="22" y="56" class="body">Normalize category • Parse JSON</text>
    <text x="22" y="78" class="body">Filter by category and budget</text>
  </g>
  <path d="M390 833 H450" class="line"/>
  <g transform="translate(475,787)">
    <rect width="205" height="92" rx="17" fill="#FFFFFF" stroke="#8EBCE0"/>
    <text x="22" y="31" class="boxTitle">Product data</text>
    <text x="22" y="58" class="body">Prototype JSON catalog</text>
    <text x="22" y="79" class="body">Future: Dataverse/API</text>
  </g>
  <path d="M680 833 H740" class="line"/>
  <g transform="translate(765,787)">
    <rect width="205" height="92" rx="17" fill="#FFFFFF" stroke="#8EBCE0"/>
    <text x="22" y="31" class="boxTitle">Visual output</text>
    <text x="22" y="58" class="body">Filtered product cards</text>
    <text x="22" y="79" class="body">Status • CSAT • retry</text>
  </g>

  <!-- Generative -->
  <g transform="translate(1080,642)">
    <rect width="400" height="86" rx="17" fill="#FFFFFF" stroke="#B99BDD"/>
    <text x="22" y="31" class="boxTitle">Generative answers / RAG</text>
    <text x="22" y="57" class="body">Semantic retrieval + grounded response</text>
    <text x="22" y="78" class="body">Technical questions outside rigid topics</text>
  </g>
  <path d="M1280 728 V764" class="line"/>
  <g transform="translate(1070,787)">
    <rect width="225" height="92" rx="17" fill="#FFFFFF" stroke="#B99BDD"/>
    <text x="18" y="31" class="boxTitle">Knowledge</text>
    <text x="18" y="57" class="body">Documents • OneDrive</text>
    <text x="18" y="78" class="body">SharePoint • approved web</text>
  </g>
  <path d="M1295 833 H1310" class="line"/>
  <g transform="translate(1325,787)">
    <rect width="165" height="92" rx="17" fill="#FFFFFF" stroke="#B99BDD"/>
    <text x="18" y="31" class="boxTitle">Output</text>
    <text x="18" y="58" class="body">Natural language</text>
    <text x="18" y="79" class="body">Visible citations</text>
  </g>

  <!-- Governance -->
  <text x="80" y="970" class="layer">CROSS-CUTTING CONTROLS</text>
  <rect x="84" y="996" width="1440" height="78" rx="20" fill="#17324D" opacity="0.09"/>
  <rect x="80" y="990" width="1440" height="78" rx="20" fill="#FFFFFF" stroke="#C8D5DF"/>
  <g transform="translate(110,1011)">
    <rect width="210" height="36" rx="18" fill="#E8F3FC"/><text x="105" y="24" text-anchor="middle" class="pill">Authentication</text>
    <rect x="230" width="220" height="36" rx="18" fill="#E8F3FC"/><text x="340" y="24" text-anchor="middle" class="pill">Privacy &amp; least privilege</text>
    <rect x="470" width="205" height="36" rx="18" fill="#E8F3FC"/><text x="572" y="24" text-anchor="middle" class="pill">Content moderation</text>
    <rect x="695" width="205" height="36" rx="18" fill="#E8F3FC"/><text x="797" y="24" text-anchor="middle" class="pill">DLP &amp; environments</text>
    <rect x="920" width="190" height="36" rx="18" fill="#E8F3FC"/><text x="1015" y="24" text-anchor="middle" class="pill">Monitoring &amp; testing</text>
    <rect x="1130" width="260" height="36" rx="18" fill="#E8F3FC"/><text x="1260" y="24" text-anchor="middle" class="pill">Topic / Flow checker • CSAT</text>
  </g>

  <text x="80" y="1100" class="footer">Current portfolio prototype • Product catalog: static JSON • Order source: controlled knowledge data • Production path: authenticated Dataverse/API</text>
</svg>
